name: Build, Deploy and Live E2E Test

on:
  push:
    branches: [ main ]
  pull_request:
    branches: [ main ]
  workflow_dispatch:

# Sets permissions of the GITHUB_TOKEN to allow deployment to GitHub Pages
permissions:
  contents: read
  pages: write
  id-token: write

# Allow one concurrent deployment
concurrency:
  group: "pages"
  cancel-in-progress: false

jobs:
  # -------------------------------------------------------------
  # 1. Build and Deploy Application to GitHub Pages
  # -------------------------------------------------------------
  deploy:
    environment:
      name: github-pages
      url: ${{ steps.deployment.outputs.page_url }}
    runs-on: ubuntu-latest
    steps:
      - name: Checkout repository
        uses: actions/checkout@v4

      - name: Setup Node.js 20
        uses: actions/setup-node@v4
        with:
          node-version: 20
          cache: 'npm'
          cache-dependency-path: frontend/package-lock.json

      - name: Install dependencies
        run: |
          npm ci --prefix frontend

      - name: Build frontend application for GitHub Pages
        env:
          VITE_BASE_PATH: /CephalometricGrowthAnalysis/
        run: |
          npm run build --prefix frontend

      - name: Setup Pages
        uses: actions/configure-pages@v5

      - name: Upload GitHub Pages artifact
        uses: actions/upload-pages-artifact@v3
        with:
          path: './frontend/dist'

      - name: Deploy to GitHub Pages
        id: deployment
        uses: actions/deploy-pages@v4

  # -------------------------------------------------------------
  # 2. Live E2E Selenium Testing against Deployed GitHub Pages URL
  # -------------------------------------------------------------
  e2e-test:
    needs: deploy
    runs-on: ubuntu-latest
    env:
      BASE_URL: https://Venugopal-9.github.io/CephalometricGrowthAnalysis/
      HEADLESS: "true"
    steps:
      - name: Checkout repository
        uses: actions/checkout@v4

      - name: Set up Python 3.11
        uses: actions/setup-python@v5
        with:
          python-version: '3.11'
          cache: 'pip'

      - name: Install Python test dependencies
        run: |
          python -m pip install --upgrade pip
          pip install -r tests/requirements.txt

      - name: Set up Chrome browser
        run: |
          sudo apt-get update
          sudo apt-get install -y google-chrome-stable

      - name: Verify Live Deployment URL (HTTP 200 check)
        run: |
          echo "Waiting for live URL $BASE_URL to return HTTP 200..."
          for i in {1..20}; do
            STATUS=$(curl -s -o /dev/null -w "%{http_code}" "$BASE_URL" || echo "000")
            echo "Attempt $i: HTTP Status = $STATUS"
            if [ "$STATUS" -eq 200 ]; then
              echo "Live site is up and reachable!"
              exit 0
            fi
            sleep 5
          done
          echo "Warning: Site did not return 200 in 100 seconds, proceeding to test..."

      - name: Execute Live Selenium E2E Tests
        run: |
          python tests/run_tests.py

      - name: Execute Node.js Selenium Web E2E Tests
        run: |
          npm --prefix node_testing install
          node node_testing/run_web_tests.js || true

      - name: Execute Baseline / Load Testing (100 Virtual Users, 60s)
        env:
          VIRTUAL_USERS: "100"
          DURATION_SECONDS: "60"
        run: |
          python tests/run_load_test.py

      - name: Upload Test Report Artifacts
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: Live-E2E-Automation-Reports
          path: |
            Test Results/Excel/Automation_Test_Report.xlsx
            Test Results/NodeJS/Excel/Automation_Web_Test_Report.xlsx
            Test Results/HTML/execution-report.html
            Test Results/Screenshots/
            Test Results/Logs/
            Test Results/Summary/summary.md
            Test Results/NodeJS/
          retention-days: 30

      - name: Publish GitHub Actions Job Execution Summary
        if: always()
        run: |
          if [ -f "Test Results/Summary/summary.md" ]; then
            cat "Test Results/Summary/summary.md" >> $GITHUB_STEP_SUMMARY
          else
            echo "# Live GitHub Pages E2E Test Summary" >> $GITHUB_STEP_SUMMARY
            echo "Deployment URL: $BASE_URL" >> $GITHUB_STEP_SUMMARY
            echo "Report file not found." >> $GITHUB_STEP_SUMMARY
          fi
