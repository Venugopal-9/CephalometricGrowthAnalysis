name: Android Appium E2E & Report Publishing

on:
  push:
    branches: [ main ]
  pull_request:
    branches: [ main ]
  workflow_dispatch:

permissions:
  contents: read
  pages: write
  id-token: write

concurrency:
  group: "${{ github.workflow }}-${{ github.ref }}"
  cancel-in-progress: true

jobs:
  # -------------------------------------------------------------
  # 1. Build Web App & Android APK, Run E2E Tests, Publish Reports
  # -------------------------------------------------------------
  build-test-and-publish:
    environment:
      name: github-pages
      url: ${{ steps.deployment.outputs.page_url }}
    runs-on: ubuntu-latest

    steps:
      - name: Checkout repository
        uses: actions/checkout@v4

      - name: Setup Java 17
        uses: actions/setup-java@v4
        with:
          distribution: 'temurin'
          java-version: 17

      - name: Setup Node.js 20
        uses: actions/setup-node@v4
        with:
          node-version: 20
          cache: 'npm'
          cache-dependency-path: frontend/package-lock.json

      - name: Install Frontend & Appium Dependencies
        run: |
          npm ci --prefix frontend
          npm install -g appium
          appium driver install uiautomator2

      - name: Build Web Application Bundle
        env:
          VITE_BASE_PATH: /CephalometricGrowthAnalysis/
        run: |
          npm run build --prefix frontend

      - name: Build Android Debug APK
        run: |
          cd frontend/android
          chmod +x gradlew
          ./gradlew assembleDebug

      - name: Setup Python 3.11
        uses: actions/setup-python@v5
        with:
          python-version: '3.11'
          cache: 'pip'

      - name: Install Python Test Dependencies
        run: |
          python -m pip install --upgrade pip
          pip install -r tests/requirements.txt

      - name: Start Appium Server in Background
        run: |
          appium --log-level info &
          sleep 5

      - name: Run Web Selenium E2E Tests
        env:
          BASE_URL: https://Venugopal-9.github.io/CephalometricGrowthAnalysis/
          HEADLESS: "true"
        run: |
          python tests/run_tests.py || true

      - name: Run Node.js Mobile Appium E2E Tests
        run: |
          npm --prefix node_testing install
          node node_testing/run_appium_tests.js || true

      - name: Execute Baseline / Load Testing (100 Virtual Users, 60s)
        env:
          BASE_URL: https://Venugopal-9.github.io/CephalometricGrowthAnalysis/
          VIRTUAL_USERS: "100"
          DURATION_SECONDS: "60"
        run: |
          python tests/run_load_test.py || true

      - name: Structure and Publish HTML Reports into dist/reports/
        run: |
          python -c "from tests.e2e.utils.report_generator import ReportGenerator; from pathlib import Path; ReportGenerator.publish_reports_to_dist(Path('./frontend/dist'), '${{ github.run_number }}')"

      - name: Setup Pages
        uses: actions/configure-pages@v5

      - name: Upload GitHub Pages Artifact (App + Reports)
        uses: actions/upload-pages-artifact@v3
        with:
          path: './frontend/dist'

      - name: Deploy App and Reports to GitHub Pages
        id: deployment
        uses: actions/deploy-pages@v4

      - name: Upload Workflow Test Artifacts
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: Android-Appium-and-E2E-Test-Reports
          path: |
            Test Results/Excel/Automation_Test_Report.xlsx
            Test Results/Appium/Excel/Automation_Appium_Test_Report.xlsx
            Test Results/NodeJS/Excel/Automation_Mobile_Appium_Report.xlsx
            Test Results/HTML/execution-report.html
            Test Results/Screenshots/
            Test Results/Logs/
            Test Results/Summary/summary.md
            Test Results/Appium/
            Test Results/NodeJS/
          retention-days: 30

      - name: Publish GitHub Actions Job Execution Summary
        if: always()
        run: |
          echo "# Android Appium & E2E Test Summary" >> $GITHUB_STEP_SUMMARY
          echo "" >> $GITHUB_STEP_SUMMARY
          echo "**Build Number**: #${{ github.run_number }}" >> $GITHUB_STEP_SUMMARY
          echo "**Execution Date**: $(date -u)" >> $GITHUB_STEP_SUMMARY
          echo "" >> $GITHUB_STEP_SUMMARY
          echo "**Live Report URL**:" >> $GITHUB_STEP_SUMMARY
          echo "https://Venugopal-9.github.io/CephalometricGrowthAnalysis/reports/latest/execution-report.html" >> $GITHUB_STEP_SUMMARY
          echo "" >> $GITHUB_STEP_SUMMARY
          echo "**Historical Build Report URL**:" >> $GITHUB_STEP_SUMMARY
          echo "https://Venugopal-9.github.io/CephalometricGrowthAnalysis/reports/history/build-${{ github.run_number }}/execution-report.html" >> $GITHUB_STEP_SUMMARY
          echo "" >> $GITHUB_STEP_SUMMARY
          if [ -f "Test Results/Summary/summary.md" ]; then
            cat "Test Results/Summary/summary.md" >> $GITHUB_STEP_SUMMARY
          fi
